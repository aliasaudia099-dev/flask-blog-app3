services:
  flask-blog3:
    image: python:3.11-slim
    volumes:
      - ./:/app
      - blog-data3:/data
      - sales-db3:/app-data
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             python app.py"
    restart: unless-stopped
    environment:
      - FLASK_ENV=development
      - PYTHONUNBUFFERED=1
      - SALES_DATA_DIR=/app-data

volumes:
  blog-data3:
    driver: local
  sales-db3:
    driver: local
