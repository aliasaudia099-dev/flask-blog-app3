services:
  flask-blog3:
    image: python:3.11-slim
    volumes:
      - ./:/app
      - payroll-data:/app-data
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             python app.py"
    restart: unless-stopped
    environment:
      - FLASK_ENV=development
      - PYTHONUNBUFFERED=1
      - SALES_DATA_DIR=/app-data
      - PAYROLL_NO_BROWSER=1
      - PAYROLL_LICENSE_CHECK=0
      - PAYROLL_MACHINE_SERIAL=9DE2-A652-843E-3352
      - PORT=5003

volumes:
  payroll-data:
    driver: local
